<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Green Starz Impakt Hub — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { 50:'#ECFDF3', 100:'#D3F8E1', 300:'#7FDDA6', 500:'#2FA361', 600:'#1E7A46', 700:'#145C34', 900:'#0B3A20' }
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="/views/assets/theme.css">
</head>
<body class="min-h-screen bg-slate-50">

<!-- HEADER -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="brand-header-group">
      <img src="/views/assets/logo.jpg" alt="Green Starz Impakt Hub" class="brand-header-logo" onerror="this.style.display='none'">
      <div>
        <span class="brand-header-name text-sm block">GREEN STARZ IMPAKT HUB</span>
        <h1 class="text-lg font-bold text-slate-800">CAPACITY BUILDING</h1>
        <p id="userLabel" class="text-xs text-slate-500"></p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button id="newRequestBtn" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg">+ Create Request</button>
      <button id="logoutBtn" class="text-sm text-slate-500 hover:text-slate-700">Log out</button>
    </div>
  </div>
  <div class="max-w-6xl mx-auto px-4 flex gap-4 border-t border-slate-100" id="tabBar"></div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">

  <!-- REQUESTER: MY REQUESTS -->
  <section id="myRequestsSection" class="hidden">
    <h2 class="text-base font-semibold text-slate-700 mb-3">My Requests</h2>
    <div id="myRequestsList" class="space-y-3"></div>
  </section>

  <!-- SERVICE LEAD / ADMIN: REQUESTS -->
  <section id="queueSection" class="hidden">
    <div class="flex items-center justify-between mb-3">
      <h2 id="queueHeading" class="text-base font-semibold text-slate-700">Incoming Service Queue</h2>
      <span class="text-xs text-slate-400"></span>
    </div>
    <div id="queueSubTabs" class="hidden gap-2 mb-4"></div>
    <div id="queueList" class="space-y-3"></div>
  </section>

  <!-- SERVICE LEAD: HISTORY (completed requests) -->
  <section id="historySection" class="hidden">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-base font-semibold text-slate-700">Completed History</h2>
      <span class="text-xs text-slate-400">Most recently completed first</span>
    </div>
    <div id="historyList" class="space-y-3"></div>
  </section>
<!-- ADMIN: HISTORY (completed + cancelled + declined, system-wide) -->
  <section id="adminHistorySection" class="hidden">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-base font-semibold text-slate-700">History</h2>
      <span class="text-xs text-slate-400">Completed, cancelled, and declined — all departments</span>
    </div>
    <div id="historyBulkBar" class="hidden items-center gap-3 mb-3 text-sm">
      <label class="flex items-center gap-2 text-slate-600">
        <input type="checkbox" id="historySelectAll" class="rounded border-slate-300">
        Select All
      </label>
      <button id="historyDeleteSelectedBtn" class="px-3 py-1.5 rounded-lg bg-red-600 text-white hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed" disabled>Delete Selected (<span id="historySelectedCount">0</span>)</button>
      <button id="historyDeleteAllBtn" class="px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50">Delete All</button>
    </div>
    <div id="adminHistoryList" class="space-y-3"></div>
  </section>
</main>

<!-- CREATE REQUEST MODAL -->
<div id="createModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-20">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
    <h3 class="text-lg font-bold text-slate-800 mb-4">Create Service Request</h3>
    <form id="createForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Target Department</label>
        <select id="cTargetDept" required class="w-full border border-slate-300 rounded-lg px-3 py-2"></select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Service Category</label>
        <select id="cCategory" class="w-full border border-slate-300 rounded-lg px-3 py-2"></select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
        <input type="text" id="cTitle" required class="w-full border border-slate-300 rounded-lg px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
        <textarea id="cDescription" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Required Due Date/Time</label>
        <input type="datetime-local" id="cDueDate" required class="w-full border border-slate-300 rounded-lg px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Attach Brief File</label>
        <input type="file" id="cAttachment" class="w-full text-sm" />
      </div>
      <p id="createError" class="text-sm text-red-600 hidden"></p>
      <div class="flex gap-2 justify-end pt-2">
        <button type="button" id="cancelCreate" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100">Cancel</button>
        <button type="submit" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium">Submit Request</button>
      </div>
    </form>
  </div>
</div>

<!-- TASK DETAIL MODAL -->
<div id="detailModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-20">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
    <div id="detailContent"></div>
    <button id="closeDetail" class="mt-4 px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100">Close</button>
  </div>
</div>

<script src="/views/app.js"></script>
<script>
requireLogin();
const user = getUser();
document.getElementById('userLabel').textContent = `${user.full_name} — ${user.role_name}${user.department_name ? ' · ' + user.department_name : ''}`;
document.getElementById('logoutBtn').addEventListener('click', logout);

const isRequester = user.role_name === 'Requester';
const isAssignee = user.role_name === 'Assignee';
const isAdmin = user.role_name === 'Admin';
const isAssigneeLike = isAssignee || isAdmin;

// --- Tabs -------------------------------------------------------------
const tabBar = document.getElementById('tabBar');
const tabs = [];
if (isRequester) tabs.push({ id: 'myRequestsSection', label: 'My Requests' });
if (isAssigneeLike) tabs.push({ id: 'queueSection', label: isAdmin ? 'Requests' : 'Service Queue' });
if (isAssignee) tabs.push({ id: 'historySection', label: 'History' });
if (isAdmin) tabs.push({ id: 'adminHistorySection', label: 'History' });
tabBar.innerHTML = tabs.map((t, i) =>
  `<button data-target="${t.id}" class="tabBtn py-3 text-sm font-medium border-b-2 ${i === 0 ? 'border-brand-600 text-brand-600' : 'border-transparent text-slate-500'}">${t.label}</button>`
).join('');
document.querySelectorAll('.tabBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabBtn').forEach(b => b.className = 'tabBtn py-3 text-sm font-medium border-b-2 border-transparent text-slate-500');
    btn.className = 'tabBtn py-3 text-sm font-medium border-b-2 border-brand-600 text-brand-600';
    tabs.forEach(t => document.getElementById(t.id).classList.add('hidden'));
    document.getElementById(btn.dataset.target).classList.remove('hidden');
  });
});
if (tabs.length) document.getElementById(tabs[0].id).classList.remove('hidden');
document.getElementById('newRequestBtn').classList.toggle('hidden', !isRequester);

// --- Admin: read-only status tabs (Not Yet Done / In Progress / Completed / Declined) ---
document.getElementById('queueHeading').textContent = isAdmin ? 'All Service Requests' : 'Incoming Service Queue';
const adminStatusTabs = [
  { status: 'PENDING', label: 'Not Yet Done' },
  { status: 'IN_PROGRESS', label: 'In Progress' },
  { status: 'COMPLETED', label: 'Completed' },
  { status: 'DECLINED', label: 'Declined' },
];
let currentAdminStatus = 'PENDING';
if (isAdmin) {
  const subTabsEl = document.getElementById('queueSubTabs');
  subTabsEl.classList.remove('hidden');
  subTabsEl.classList.add('flex');
  const activeCls = 'adminStatusTab text-sm px-3 py-1.5 rounded-full border bg-brand-600 text-white border-brand-600';
  const inactiveCls = 'adminStatusTab text-sm px-3 py-1.5 rounded-full border bg-white text-slate-600 border-slate-300';
  subTabsEl.innerHTML = adminStatusTabs.map((t, i) =>
    `<button data-status="${t.status}" class="${i === 0 ? activeCls : inactiveCls}">${t.label}</button>`
  ).join('');
  subTabsEl.querySelectorAll('.adminStatusTab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentAdminStatus = btn.dataset.status;
      subTabsEl.querySelectorAll('.adminStatusTab').forEach(b => b.className = inactiveCls);
      btn.className = activeCls;
      loadQueue();
    });
  });
}

// --- Create Request modal ---------------------------------------------
const createModal = document.getElementById('createModal');
document.getElementById('newRequestBtn').addEventListener('click', async () => {
  await populateDeptAndCategory();
  document.getElementById('cDueDate').min = toLocalDatetimeInputValue(new Date());
  createModal.classList.remove('hidden');
});

/** Formats a Date as the local "YYYY-MM-DDTHH:mm" string a datetime-local input expects. */
function toLocalDatetimeInputValue(date) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
document.getElementById('cancelCreate').addEventListener('click', () => createModal.classList.add('hidden'));

async function populateDeptAndCategory() {
  const deptSelect = document.getElementById('cTargetDept');
  const catSelect = document.getElementById('cCategory');
  const { departments } = await api('/requests/lookups/departments');
  deptSelect.innerHTML = departments.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
  await refreshCategories();
  deptSelect.addEventListener('change', refreshCategories);

  async function refreshCategories() {
    const { categories } = await api(`/requests/lookups/categories?departmentId=${deptSelect.value}`);
    catSelect.innerHTML = '<option value="">(none)</option>' + categories.map(c => `<option value="${c.id}">${c.category_name}</option>`).join('');
  }
}

document.getElementById('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('createError');
  errorEl.classList.add('hidden');

  const dueDateValue = document.getElementById('cDueDate').value;
  if (!dueDateValue || new Date(dueDateValue) <= new Date()) {
    errorEl.textContent = 'Required Due Date/Time must be in the future.';
    errorEl.classList.remove('hidden');
    return;
  }

  try {
    const form = new FormData();
    form.append('targetDepartmentId', document.getElementById('cTargetDept').value);
    form.append('categoryId', document.getElementById('cCategory').value);
    form.append('title', document.getElementById('cTitle').value);
    form.append('description', document.getElementById('cDescription').value);
    form.append('requestedDueDate', document.getElementById('cDueDate').value);
    const fileInput = document.getElementById('cAttachment');
    if (fileInput.files[0]) form.append('attachment', fileInput.files[0]);

    await api('/requests', { method: 'POST', body: form, isForm: true });
    createModal.classList.add('hidden');
    document.getElementById('createForm').reset();
    loadMyRequests();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove('hidden');
  }
});

// --- My Requests (Requester) -------------------------------------------
async function loadMyRequests() {
  if (!isRequester) return;
  const list = document.getElementById('myRequestsList');
  list.innerHTML = '<p class="text-slate-400 text-sm">Loading…</p>';
  try {
    const { requests } = await api('/requests/mine');
    if (!requests.length) {
      list.innerHTML = '<p class="text-slate-400 text-sm">You have not submitted any requests yet.</p>';
      return;
    }
    list.innerHTML = requests.map(renderRequesterCard).join('');
    attachDetailHandlers();
    attachRequesterCardHandlers();
  } catch (err) {
    list.innerHTML = `<p class="text-red-600 text-sm">${err.message}</p>`;
  }
}
function attachRequesterCardHandlers() {
  document.querySelectorAll('.requesterCancelBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Cancel this request? This cannot be undone.')) return;
      try {
        await api(`/requests/${btn.dataset.id}/cancel`, { method: 'POST' });
        loadMyRequests();
      } catch (err) {
        alert(err.message);
      }
    });
  });
}

function statusPill(status) {
  const map = {
    PENDING: 'bg-slate-100 text-slate-700',
    IN_PROGRESS: 'bg-blue-100 text-blue-700',
    COMPLETED: 'bg-green-100 text-green-700',
    CANCELLED: 'bg-slate-200 text-slate-500 line-through',
    DECLINED: 'bg-red-100 text-red-600 line-through',
  };
  return `<span class="px-2 py-0.5 rounded-full text-xs font-medium ${map[status] || ''}">${status.replace('_',' ')}</span>`;
}

function renderRequesterCard(r) {
  return `
  <div class="bg-white rounded-xl border border-slate-200 p-4">
    <div class="flex justify-between items-start">
      <div class="detail-trigger cursor-pointer" data-id="${r.id}">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="font-semibold text-slate-800">${r.title}</h3>
          ${statusPill(r.status)}
        </div>
        <p class="text-sm text-slate-500">${r.target_department_name} ${r.category_name ? '· ' + r.category_name : ''}</p>
        <p class="text-xs text-slate-400 mt-1">Due ${formatDate(r.requested_due_date)}</p>
      </div>
      <span class="text-xs font-medium px-2 py-1 rounded-full ${badgeClasses(r.badge.color)}">${r.badge.label}</span>
    </div>
    ${r.status === 'PENDING' ? `<div class="mt-3"><button class="requesterCancelBtn text-sm px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50" data-id="${r.id}">Cancel Request</button></div>` : ''}
  </div>`;
}

function attachAdminRequestHandlers(container, onDeleted) {
  container.querySelectorAll('.adminDeleteBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Permanently delete this request? This cannot be undone.')) return;
      try {
        await api(`/requests/${btn.dataset.id}`, { method: 'DELETE' });
        onDeleted();
      } catch (err) { alert(err.message); }
    });
  });
}
// --- Service Queue (Assignee: actionable) / Requests (Admin: read-only) ---
async function loadQueue() {
  if (!isAssigneeLike) return;
  const list = document.getElementById('queueList');
  list.innerHTML = '<p class="text-slate-400 text-sm">Loading…</p>';
  try {
    const statusParam = isAdmin ? `?status=${currentAdminStatus}` : '';
    const { requests } = await api(`/requests/queue${statusParam}`);
    if (!requests.length) {
      list.innerHTML = '<p class="text-slate-400 text-sm">Nothing here right now.</p>';
      return;
    }
    list.innerHTML = requests.map(isAdmin ? renderAdminRequestCard : renderQueueCard).join('');
    attachDetailHandlers();
    if (isAdmin) attachAdminRequestHandlers(list, loadQueue);
    if (!isAdmin) attachQueueActionHandlers();
  } catch (err) {
    list.innerHTML = `<p class="text-red-600 text-sm">${err.message}</p>`;
  }
}

function renderAdminRequestCard(r) {
  const showAssignee = r.status === 'IN_PROGRESS' || r.status === 'COMPLETED';
  const canDelete = ['COMPLETED', 'CANCELLED', 'DECLINED'].includes(r.status);
  return `
  <div class="bg-white rounded-xl border border-slate-200 p-4">
    <div class="flex justify-between items-start">
      <div class="cursor-pointer detail-trigger" data-id="${r.id}">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="font-semibold text-slate-800">${r.title}</h3>
          ${statusPill(r.status)}
        </div>
        <p class="text-sm text-slate-500">${r.target_department_name} · From ${r.requester_name} ${r.category_name ? '· ' + r.category_name : ''}</p>
        <p class="text-xs text-slate-400 mt-1">Due ${formatDate(r.requested_due_date)} · Submitted ${formatDate(r.created_at)}</p>
        ${showAssignee ? `<p class="text-xs text-slate-500 mt-1">Assignee: <span class="font-medium text-slate-700">${r.assignee_name || 'Unassigned'}</span></p>` : ''}
      </div>
      <span class="text-xs font-medium px-2 py-1 rounded-full ${badgeClasses(r.badge.color)}">${r.badge.label}</span>
    </div>
    ${canDelete ? `<div class="mt-3"><button class="adminDeleteBtn text-sm px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50" data-id="${r.id}">Delete</button></div>` : ''}
  </div>`;
}

function renderQueueCard(r) {
  return `
  <div class="bg-white rounded-xl border border-slate-200 p-4">
    <div class="flex justify-between items-start">
      <div class="detail-trigger cursor-pointer" data-id="${r.id}">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="font-semibold text-slate-800">${r.title}</h3>
          ${statusPill(r.status)}
        </div>
        <p class="text-sm text-slate-500">From ${r.requester_name} · ${r.category_name || 'General'}</p>
        <p class="text-xs text-slate-400 mt-1">Due ${formatDate(r.requested_due_date)} · Submitted ${formatDate(r.created_at)}</p>
      </div>
      <span class="text-xs font-medium px-2 py-1 rounded-full ${badgeClasses(r.badge.color)}">${r.badge.label}</span>
    </div>
    <div class="mt-3 flex gap-2">
      ${r.status === 'PENDING' ? `<button class="startBtn text-sm px-3 py-1.5 rounded-lg bg-brand-600 text-white hover:bg-brand-700" data-id="${r.id}">Start Working</button>` : ''}
      ${r.status === 'PENDING' ? `<button class="declineBtn text-sm px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50" data-id="${r.id}">Decline</button>` : ''}
      ${r.status === 'IN_PROGRESS' ? `<button class="deliverBtn text-sm px-3 py-1.5 rounded-lg bg-green-600 text-white hover:bg-green-700" data-id="${r.id}">Complete &amp; Deliver</button>` : ''}
    </div>
  </div>`;
}

function attachQueueActionHandlers() {
  document.querySelectorAll('.startBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        await api(`/requests/${btn.dataset.id}/start`, { method: 'POST' });
        loadQueue();
      } catch (err) { alert(err.message); }
    });
  });
  document.querySelectorAll('.declineBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Decline this request? The requester will be notified.')) return;
      try {
        await api(`/requests/${btn.dataset.id}/decline`, { method: 'POST' });
        loadQueue();
      } catch (err) { alert(err.message); }
    });
  });
  document.querySelectorAll('.deliverBtn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openDeliverPrompt(btn.dataset.id);
    });
  });
}

function openDeliverPrompt(requestId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = async () => {
    if (!input.files[0]) return;
    const form = new FormData();
    form.append('deliverable', input.files[0]);
    try {
      await api(`/requests/${requestId}/deliver`, { method: 'POST', body: form, isForm: true });
      loadQueue();
    } catch (err) { alert(err.message); }
  };
  input.click();
}
// --- History (Assignee: personal completed + declined) -----------------
async function loadHistory() {
  if (!isAssignee) return;
  const list = document.getElementById('historyList');
  list.innerHTML = '<p class="text-slate-400 text-sm">Loading…</p>';
  try {
    const { requests } = await api('/requests/history');
    if (!requests.length) {
      list.innerHTML = '<p class="text-slate-400 text-sm">Nothing here yet.</p>';
      return;
    }
    list.innerHTML = requests.map(renderHistoryCard).join('');
    attachDetailHandlers();
  } catch (err) {
    list.innerHTML = `<p class="text-red-600 text-sm">${err.message}</p>`;
  }
}

function renderHistoryCard(r) {
  const verb = r.status === 'DECLINED' ? 'Declined' : 'Completed';
  return `
  <div class="bg-white rounded-xl border border-slate-200 p-4">
    <div class="detail-trigger cursor-pointer" data-id="${r.id}">
      <div class="flex items-center gap-2 mb-1">
        <h3 class="font-semibold text-slate-800">${r.title}</h3>
        ${statusPill(r.status)}
      </div>
      <p class="text-sm text-slate-500">From ${r.requester_name} · ${r.category_name || 'General'}</p>
      <p class="text-xs text-slate-400 mt-1">${verb} ${formatDate(r.updated_at)}</p>
    </div>
  </div>`;
}

// --- History (Admin: system-wide completed + cancelled + declined) -----
async function loadAdminHistory() {
  if (!isAdmin) return;
  const list = document.getElementById('adminHistoryList');
  const bulkBar = document.getElementById('historyBulkBar');
  list.innerHTML = '<p class="text-slate-400 text-sm">Loading…</p>';
  bulkBar.classList.add('hidden');
  bulkBar.classList.remove('flex');
  try {
    const { requests } = await api('/requests/admin-history');
    if (!requests.length) {
      list.innerHTML = '<p class="text-slate-400 text-sm">Nothing here yet.</p>';
      return;
    }
    list.innerHTML = requests.map(renderAdminHistoryCard).join('');
    attachDetailHandlers();
    attachAdminRequestHandlers(list, loadAdminHistory);
    setupHistoryBulkActions(list, bulkBar);
    bulkBar.classList.remove('hidden');
    bulkBar.classList.add('flex');
  } catch (err) {
    list.innerHTML = `<p class="text-red-600 text-sm">${err.message}</p>`;
  }
}

/** Same card as renderAdminRequestCard, but with a select checkbox for bulk delete. */
function renderAdminHistoryCard(r) {
  const showAssignee = r.status === 'IN_PROGRESS' || r.status === 'COMPLETED';
  return `
  <div class="bg-white rounded-xl border border-slate-200 p-4 flex gap-3">
    <input type="checkbox" class="historySelectCheckbox mt-1 rounded border-slate-300" data-id="${r.id}">
    <div class="flex-1">
      <div class="flex justify-between items-start">
        <div class="cursor-pointer detail-trigger" data-id="${r.id}">
          <div class="flex items-center gap-2 mb-1">
            <h3 class="font-semibold text-slate-800">${r.title}</h3>
            ${statusPill(r.status)}
          </div>
          <p class="text-sm text-slate-500">${r.target_department_name} · From ${r.requester_name} ${r.category_name ? '· ' + r.category_name : ''}</p>
          <p class="text-xs text-slate-400 mt-1">Due ${formatDate(r.requested_due_date)} · Submitted ${formatDate(r.created_at)}</p>
          ${showAssignee ? `<p class="text-xs text-slate-500 mt-1">Assignee: <span class="font-medium text-slate-700">${r.assignee_name || 'Unassigned'}</span></p>` : ''}
        </div>
        <span class="text-xs font-medium px-2 py-1 rounded-full ${badgeClasses(r.badge.color)}">${r.badge.label}</span>
      </div>
      <div class="mt-3"><button class="adminDeleteBtn text-sm px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50" data-id="${r.id}">Delete</button></div>
    </div>
  </div>`;
}

/** Wires up the Select All / Delete Selected / Delete All toolbar above the admin History list. */
function setupHistoryBulkActions(list, bulkBar) {
  const selectAll = document.getElementById('historySelectAll');
  const deleteSelectedBtn = document.getElementById('historyDeleteSelectedBtn');
  const deleteAllBtn = document.getElementById('historyDeleteAllBtn');
  const countLabel = document.getElementById('historySelectedCount');

  selectAll.checked = false;

  function refreshCount() {
    const checked = list.querySelectorAll('.historySelectCheckbox:checked');
    countLabel.textContent = checked.length;
    deleteSelectedBtn.disabled = checked.length === 0;
  }

  list.querySelectorAll('.historySelectCheckbox').forEach(cb => {
    cb.addEventListener('change', refreshCount);
  });

  // Assigning .onclick (not addEventListener) so re-running this setup on
  // every reload replaces the handler instead of stacking a new one.
  selectAll.onclick = () => {
    list.querySelectorAll('.historySelectCheckbox').forEach(cb => { cb.checked = selectAll.checked; });
    refreshCount();
  };

  deleteSelectedBtn.onclick = async () => {
    const ids = Array.from(list.querySelectorAll('.historySelectCheckbox:checked')).map(cb => cb.dataset.id);
    if (!ids.length) return;
    if (!confirm(`Permanently delete ${ids.length} selected request(s)? This cannot be undone.`)) return;
    await deleteRequestsByIds(ids);
    loadAdminHistory();
  };

  deleteAllBtn.onclick = async () => {
    const ids = Array.from(list.querySelectorAll('.historySelectCheckbox')).map(cb => cb.dataset.id);
    if (!ids.length) return;
    if (!confirm(`Permanently delete ALL ${ids.length} request(s) in history? This cannot be undone.`)) return;
    await deleteRequestsByIds(ids);
    loadAdminHistory();
  };

  refreshCount();
}

async function deleteRequestsByIds(ids) {
  for (const id of ids) {
    try {
      await api(`/requests/${id}`, { method: 'DELETE' });
    } catch (err) {
      console.error(`Failed to delete request ${id}:`, err.message);
    }
  }
}
// --- Task Detail modal (comments) ---------------------------------------
const detailModal = document.getElementById('detailModal');
document.getElementById('closeDetail').addEventListener('click', () => detailModal.classList.add('hidden'));

function attachDetailHandlers() {
  document.querySelectorAll('.detail-trigger').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id));
  });
}

async function openDetail(id) {
  const content = document.getElementById('detailContent');
  content.innerHTML = '<p class="text-slate-400 text-sm">Loading…</p>';
  detailModal.classList.remove('hidden');
  try {
    const [{ request: r }, { comments }] = await Promise.all([
      api(`/requests/${id}`),
      api(`/requests/${id}/comments`),
    ]);
    content.innerHTML = `
      <div class="flex items-center gap-2 mb-1">
        <h3 class="text-lg font-bold text-slate-800">${r.title}</h3>
        ${statusPill(r.status)}
      </div>
      <p class="text-sm text-slate-500 mb-1">${r.target_department_name} ${r.category_name ? '· ' + r.category_name : ''}</p>
      <p class="text-sm text-slate-600 mb-2">${r.description || ''}</p>
      <p class="text-xs text-slate-400">Due ${formatDate(r.requested_due_date)} · Submitted ${formatDate(r.created_at)}</p>
      ${r.attachment_url ? `<a class="text-sm text-brand-600 underline" href="${r.attachment_url}" target="_blank">View brief attachment</a><br/>` : ''}
      ${r.completed_attachment_url ? `<a class="text-sm text-green-600 underline font-medium" href="/api/requests/${r.id}/download">⬇ Download Deliverable</a>` : ''}
      <hr class="my-3" />
      <h4 class="text-sm font-semibold text-slate-700 mb-2">Discussion</h4>
      <div class="space-y-2 mb-3 max-h-48 overflow-y-auto">
        ${comments.length ? comments.map(c => `
          <div class="bg-slate-50 rounded-lg p-2">
            <p class="text-xs font-medium text-slate-700">${c.author_name}</p>
            <p class="text-sm text-slate-600">${c.message || ''}</p>
            ${c.attachment_url ? `<a class="text-xs text-brand-600 underline" href="${c.attachment_url}" target="_blank">attachment</a>` : ''}
          </div>`).join('') : '<p class="text-xs text-slate-400">No comments yet.</p>'}
      </div>
      <form id="commentForm" class="flex gap-2">
        <input type="text" id="commentMessage" placeholder="Write a comment…" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        <button type="submit" class="px-3 py-2 rounded-lg bg-brand-600 text-white text-sm font-medium">Post Comment</button>
      </form>
    `;
    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('commentMessage');
      if (!input.value.trim()) return;
      try {
        await api(`/requests/${id}/comments`, { method: 'POST', body: { message: input.value } });
        openDetail(id);
      } catch (err) { alert(err.message); }
    });
  } catch (err) {
    content.innerHTML = `<p class="text-red-600 text-sm">${err.message}</p>`;
  }
}
