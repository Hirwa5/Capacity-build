<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Green Starz Impakt Hub — Auth Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { 50:'#ECFDF3', 100:'#D3F8E1', 300:'#7FDDA6', 500:'#2FA361', 600:'#1E7A46', 700:'#145C34', 900:'#0B3A20' }
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="/views/assets/theme.css">
</head>
<body class="min-h-screen flex flex-col justify-between p-4 relative overflow-x-hidden font-sans">

  <!-- Background Photo -->
  <div class="absolute inset-0 bg-cover bg-center -z-20" style="background-image:url('/views/assets/login-bg.jpg');"></div>
  
  <!-- Dynamic Darkening Overlay -->
  <div id="bgOverlay" class="absolute inset-0 bg-black/20 transition-all duration-500 ease-in-out -z-10"></div>

  <!-- Top Navigation Header -->
  <header class="w-full max-w-7xl mx-auto flex justify-between items-center py-2 px-4 z-10">
    <div class="flex items-center space-x-3">
      <img src="/views/assets/logo.jpg" alt="Green Starz Logo" class="h-20 w-20 object-contain rounded-full bg-white p-1 shadow-md" onerror="this.style.display='none'">
    </div>
    <div class="flex space-x-6 text-white text-base font-medium drop-shadow-md">
      <button id="navLoginBtn" class="hover:text-brand-300 transition px-3 py-1 rounded-md">Sign In</button>
      <button id="navRegisterBtn" class="hover:text-brand-300 transition px-3 py-1 rounded-md">Register</button>
    </div>
  </header>

  <!-- Glassmorphism Form Card (Hidden by default) -->
  <main id="authCard" class="my-auto flex justify-center items-center z-10 w-full py-2 hidden transition-all duration-300">
    <div class="w-full max-w-md bg-white/35 backdrop-blur-xl border border-white/40 rounded-2xl shadow-2xl p-6 relative">
      
      <!-- Close Button -->
      <button id="closeCardBtn" class="absolute top-3 right-4 text-slate-700 hover:text-slate-900 font-bold text-xl focus:outline-none">&times;</button>

      <!-- Card Header -->
      <div class="text-center mb-4">
        <div class="flex items-center justify-center space-x-2 mb-1">
          <img src="/views/assets/logo.jpg" alt="Logo" class="h-7 w-7 rounded-full" onerror="this.style.display='none'">
          <span class="text-emerald-950 font-bold tracking-wide text-xs">GREEN STARZ IMPAKT HUB</span>
        </div>
        <h1 class="text-xl font-black text-slate-900 tracking-tight">CAPACITY BUILDING</h1>
        <p class="text-slate-800 text-[11px] mt-0.5 font-semibold">Internal Service Desk &amp; Task Allocation Portal</p>
      </div>

      <!-- LOGIN FORM ONLY -->
      <form id="loginForm" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-900 mb-1">Corporate Email</label>
          <input type="email" id="loginEmail" required class="w-full bg-white/90 border border-slate-300 rounded-lg px-3 py-1.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm transition" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-900 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full bg-white/90 border border-slate-300 rounded-lg px-3 py-1.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm transition" />
        </div>
        <p id="loginError" class="text-xs text-red-600 font-semibold hidden"></p>
        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2 rounded-lg shadow-md transition text-sm">Sign In</button>
      </form>

      <!-- REGISTER FORM ONLY (Compact to fit without scrolling) -->
      <form id="registerForm" class="space-y-2.5 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-900 mb-0.5">Full Name</label>
          <input type="text" id="regName" required class="w-full bg-white/90 border border-slate-300 rounded-lg px-3 py-1.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm transition" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-900 mb-0.5">Corporate Email</label>
          <input type="email" id="regEmail" required class="w-full bg-white/90 border border-slate-300 rounded-lg px-3 py-1.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm transition" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-900 mb-0.5">Home Department</label>
          <select id="regDepartment" required class="w-full bg-white/90 border border-slate-300 rounded-lg px-3 py-1.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm transition"></select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-900 mb-0.5">Password</label>
          <input type="password" id="regPassword" required minlength="6" class="w-full bg-white/90 border border-slate-300 rounded-lg px-3 py-1.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm transition" />
        </div>
        <p id="registerError" class="text-xs text-red-600 font-semibold hidden"></p>
        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2 rounded-lg shadow-md transition text-sm mt-1">Create Account</button>
        <p class="text-[10px] text-slate-900 text-center leading-tight font-medium pt-1"></p>
      </form>

    </div>
  </main>

  <footer class="w-full text-center text-xs text-white drop-shadow py-2 z-10">
    &copy; GREEN STARZ IMPAKT HUB — All Rights Reserved.
  </footer>

<script src="/views/app.js"></script>
<script>
  const authCard = document.getElementById('authCard');
  const bgOverlay = document.getElementById('bgOverlay');
  const navLoginBtn = document.getElementById('navLoginBtn');
  const navRegisterBtn = document.getElementById('navRegisterBtn');
  const closeCardBtn = document.getElementById('closeCardBtn');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');

  function openCard() {
    authCard.classList.remove('hidden');
    bgOverlay.className = 'absolute inset-0 bg-black/65 backdrop-blur-sm transition-all duration-500 ease-in-out -z-10';
  }

  function closeCard() {
    authCard.classList.add('hidden');
    bgOverlay.className = 'absolute inset-0 bg-black/20 transition-all duration-500 ease-in-out -z-10';
    navLoginBtn.className = 'hover:text-brand-300 transition px-3 py-1 rounded-md text-white';
    navRegisterBtn.className = 'hover:text-brand-300 transition px-3 py-1 rounded-md text-white';
  }

  navLoginBtn.addEventListener('click', () => {
    openCard();
    loginForm.classList.remove('hidden');
    registerForm.classList.add('hidden');
    
    navLoginBtn.className = 'hover:text-brand-300 transition px-3 py-1 rounded-md text-brand-300 font-bold border-b-2 border-brand-300';
    navRegisterBtn.className = 'hover:text-brand-300 transition px-3 py-1 rounded-md text-white';
  });

  navRegisterBtn.addEventListener('click', async () => {
    openCard();
    registerForm.classList.remove('hidden');
    loginForm.classList.add('hidden');
    
    navRegisterBtn.className = 'hover:text-brand-300 transition px-3 py-1 rounded-md text-brand-300 font-bold border-b-2 border-brand-300';
    navLoginBtn.className = 'hover:text-brand-300 transition px-3 py-1 rounded-md text-white';
    
    await loadDepartments();
  });

  closeCardBtn.addEventListener('click', closeCard);

  async function loadDepartments() {
    const select = document.getElementById('regDepartment');
    if (select.options.length) return;
    try {
      const res = await fetch('/api/requests/lookups/departments');
      const data = await res.json();
      select.innerHTML = data.departments.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    } catch (e) {
      select.innerHTML = '<option value="">Unable to load departments</option>';
    }
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('loginError');
    errorEl.classList.add('hidden');
    try {
      const data = await api('/auth/login', {
        method: 'POST',
        body: {
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value,
        },
      });
      setSession(data.token, data.user);
      if (data.user.role_name === 'Admin') {
        window.location.href = '/views/admin.html';
      } else {
        window.location.href = '/views/dashboard.html';
      }
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove('hidden');
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('registerError');
    errorEl.classList.add('hidden');
    try {
      const data = await api('/auth/register', {
        method: 'POST',
        body: {
          fullName: document.getElementById('regName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
          departmentId: document.getElementById('regDepartment').value,
        },
      });
      setSession(data.token, data.user);
      window.location.href = '/views/dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
